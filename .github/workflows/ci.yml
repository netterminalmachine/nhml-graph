name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# else the gh token gets whatever the repo or org has as the default:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ncurses (clear in make test) needs TERM; Actions has neither a TTY nor TERM
    env:
      TERM: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify and test
        run: make check
